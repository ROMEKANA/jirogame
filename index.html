<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>人狼</title>
    <link rel="icon" href="./favicon.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./mobile.css" media="(max-width: 768px)">
</head>

<body>

<div class="status-area">
    <div id="nowversion">現在のバージョン: 1.3.0</div>

    <div id="status">Firebase接続確認中...</div>
    
    <input type="text" id="userName" placeholder="名前を入力">
    <br>
    <button id="btn-join">参加する</button>
    <br>
    あなたの名前: <span id="name-display">未参加</span>
    <br>
    
</div>

<hr>

<div class="roll-area">

    <div id="role-assign" style="display: none;">
        <div id="role-counter" class="role-counter"></div>

        <button id="btn-assign">役職を配る</button>
        <div id="settings-list">設定がここに表示されます</div>
    </div>
    <button id="btn-roleareahidden">設定を表示</button>
    <br>
    現在の役職の振り分け: 
    <br>
    <span id="nowroles">振り分けられたら表示されます</span>
</div>

<hr>

<div class="info-area">

    今の参加人数: <span id="player-count">0</span>人
    <br>

    <div id="player-list">参加者の名前がここに表示されます</div>
    <!--
    <br>

    <br>-->
    <div id="alive-list"><!--生存者の名前がここに表示されます--></div>
    <!--
    現在プレイヤーリストに併合中、死亡者にのみ表示する予定
    <br>
    -->
</div>

<hr>

<div class="gameinfo-area">

    日数: <span id="day-count">不明</span>
    <br>
    現在の時間帯: <span id="isDaytime-display">不明</span>
    <br>
    タイマー: <span id="timer-display">--:--</span>
    <button id="btn-timer-reset">タイマーをリセット</button>
    <br>
    生存人数: <span id="alive-count">0</span>人
    <br>
    勝利陣営: <span id="winner-display">不明</span>
    <br>
    <button id="btn-next">ゲームスタート</button>
    

</div>

<hr>

<div class="game-area">
    あなたの役職: <span id="role-display">参加したら役職が表示されます</span>
    <br>
    前回の占いの結果: <span id="fortune-display">占い結果がここに表示されます</span>

    <div id="action-display">行動内容がここに表示されます。
        <br>ゲーム開始までお待ちください。</div> 

    <div id="vote-list"></div>

    <button id="btn-action">行動</button>

<hr>

<div class="score-area">

    全員のスコア:
    <div id="score-list">全員のスコアがここに表示されます</div>

</div>

<hr>

<div class="admin-area">

    <input type="text" id="deleteName" placeholder="削除するプレイヤーの名前を入力">
    <br>
    <button id="btn-playerdelete">プレイヤーを1人削除</button>
    <br>
    <button id="btn-scorereset">全員のスコアをリセット</button>
    <br>
    <button id="btn-testtools-toggle" class="danger-button">テスト用ボタンを表示</button>

    <div id="test-tools" style="display: none;">
        <button id="btn-ahead" class="danger-button">一日進める（テスト用）</button>
        <br>
        <button id="randomkill" class="danger-button">ランダムに1人殺す(テスト用)</button>       
        <br>
        <button id="btn-allget" class="danger-button">全てのデータをコンソールに表示</button>
        <br>
        <button id="btn-alldelete" class="danger-button">全データ削除</button>
    </div>

</div>

<script type="module" src="./main.js"></script>
</body>

</html>
