<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>人狼</title>
    <link rel="icon" href="./favicon.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./mobile.css" media="(max-width: 768px)">
</head>

<body>

<div id="status-area" class="area">
    現在のバージョン: <span id="nowversion">3.1.0</span>

    <br>

    <div id="status">Firebase接続確認中...</div>
    
    <input type="text" id="userName" placeholder="名前を入力">
    <br>
    <button id="btn-join">参加する</button>
    <br>
    あなたの名前: <span id="name-display" class="bold-word">未参加</span>
    <br>
    
</div>

<hr>

<div id="roll-area" class="area">

    <button id="btn-roleareahidden">設定を表示</button>

    <div id="role-assign" class="display" style="display: none;">
        <div id="role-counter" class="role-counter-list"></div>

        <button id="btn-assign">役職を配る</button>
        <div id="settings-list" class="display">設定がここに表示されます</div>
    </div>
    <br>
    現在の役職の振り分け: 
    <br>
    <span id="nowroles" class="display">振り分けられたら表示されます</span>
</div>

<hr>

<div id="info-area" class="area">

    今の参加人数: <span id="player-count">0</span>人
    <br>

    <div id="player-list" class="display">参加者の名前がここに表示されます</div>
    
</div>

<hr>

<div id="gameinfo-area" class="area">

    日数: <span id="day-count" class="bold-word">不明</span>
    <br>
    現在の時間帯: <span id="isDaytime-display" class="bold-word">不明</span>
    <br>
    タイマー: <span id="timer-display" class="bold-word">--:--</span>
    <button id="btn-timer-reset">タイマーをリセット</button>
    <br>
    生存人数: <span id="alive-count">0</span>人
    <br>
    勝利陣営: <span id="winner-display">不明</span>
    <br>
    <button id="btn-next">ゲームスタート</button>
    

</div>

<hr>

<div id="game-area" class="area">

    あなたの役職: <span id="role-display" class="bold-word">参加したら役職が表示されます</span>

    <br>

    <div class="display">
        前の選択: <span id="fortune-display" class="bold-word">未選択</span>
    </div>

    <div id="action-display" class="display">行動内容がここに表示されます。
        <br>ゲーム開始までお待ちください。</div> 

    <div id="vote-list" class="display"></div>

    <div id="selected-display" class="display">選択中: <span id="selected-player" class="bold-word">未選択</span></div>
    
</div>

<hr>

<div id="score-area" class="area">

    全員のスコア:
    <div id="score-list" class="display">全員のスコアがここに表示されます</div>

</div>

<hr>

<div id="admin-area" class="area">

    <input type="text" id="deleteName" placeholder="削除するプレイヤーの名前を入力">
    <br>
    <button id="btn-playerdelete">プレイヤーを1人削除</button>
    <br>
    <button id="btn-scorereset">全員のスコアをリセット</button>
    <br>
    <button id="btn-testtools-toggle" class="danger-button">テスト用ボタンを表示</button>

    <div id="test-tools" style="display: none;">
        <button id="btn-ahead" class="danger-button">一つ進める（テスト用）</button>
        <br>
        <button id="randomkill" class="danger-button">ランダムに1人殺す(テスト用)</button>       
        <br>
        <button id="btn-allget" class="danger-button">全てのデータをコンソールに表示</button>
        <br>
        <button id="btn-alldelete" class="danger-button">全データ削除</button>
    </div>

</div>

<script type="module" src="./main.js"></script>
</body>

</html>
